services:
  - type: web
    name: imagine-self-check-in
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: IMAGINE_DESK_URL
        sync: false
      - key: IMAGINE_DESK_USERNAME
        sync: false
      - key: IMAGINE_DESK_PASSWORD
        sync: false
      - key: SELF_CHECKIN_DATABASE_URL
        fromDatabase:
          name: imagine-self-check-in-db
          property: connectionString
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "1"
      - key: SMTP_SECONDARY_HOST
        sync: false
      - key: SMTP_SECONDARY_PORT
        value: "587"
      - key: SMTP_SECONDARY_USERNAME
        sync: false
      - key: SMTP_SECONDARY_PASSWORD
        sync: false
      - key: SMTP_SECONDARY_FROM
        sync: false
      - key: SMTP_SECONDARY_USE_TLS
        value: "1"
      - key: SMTP_PRIMARY_DAILY_LIMIT
        value: "300"
      - key: SMTP_SECONDARY_DAILY_LIMIT
        value: "300"
      - key: SMTP_QUOTA_TIMEZONE
        value: Africa/Tunis

databases:
  - name: imagine-self-check-in-db
    plan: free
    databaseName: imagine_self_check_in
    user: imagine_self_check_in
